- name: Renderizar docker-compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/app/docker-compose.yml
    mode: "0644"

- name: Renderizar configuração do nginx
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /opt/app/nginx/default.conf
    mode: "0644"

- name: Subir stack Docker Compose
  community.docker.docker_compose_v2:
    project_src: /opt/app
    state: present
    pull: always

- name: Esperar nginx ficar healthy
  community.docker.docker_container_info:
    name: nginx
  register: nginx_info
  until: nginx_info.container.State.Health.Status == 'healthy'
  retries: 30
  delay: 5
