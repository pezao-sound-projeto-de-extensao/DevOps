- name: Criar diretórios da stack
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/app/nginx
    - /opt/app/fluent-bit

- name: Renderizar arquivo .env
  ansible.builtin.template:
    src: app.env.j2
    dest: /opt/app/.env
    mode: "0600"

- name: Renderizar stack do swarm
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/app/docker-compose.yml
    mode: "0644"

- name: Renderizar configuração do nginx
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /opt/app/nginx/default.conf
    mode: "0644"

- name: Renderizar configuração do Fluent Bit
  ansible.builtin.template:
    src: fluent-bit.conf.j2
    dest: /opt/app/fluent-bit/fluent-bit.conf
    mode: "0644"

- name: Login no ECR
  ansible.builtin.shell: >
    aws ecr get-login-password --region us-east-1
    | docker login --username AWS --password-stdin {{ app_image.split('/')[0] }}

- name: Deploy da stack no swarm
  ansible.builtin.command: docker stack deploy --with-registry-auth --prune -c /opt/app/docker-compose.yml stockflow

- name: Esperar back ficar disponível
  ansible.builtin.uri:
    url: http://localhost/api/health
  register: health
  until: health.status == 200
  retries: 60
  delay: 5

- name: Instalar script de autodeploy
  ansible.builtin.copy:
    src: autodeploy.sh
    dest: /usr/local/bin/autodeploy.sh
    mode: "0755"
  tags: autodeploy

- name: Criar serviço e timer do autodeploy
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    mode: "0644"
  loop:
    - name: autodeploy.service
      content: |
        [Unit]
        Description=Atualiza o swarm quando a tag :main muda no ECR

        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/autodeploy.sh
    - name: autodeploy.timer
      content: |
        [Unit]
        Description=Checa o ECR a cada minuto

        [Timer]
        OnBootSec=2min
        OnUnitActiveSec=1min

        [Install]
        WantedBy=timers.target
  tags: autodeploy

- name: Habilitar timer do autodeploy
  ansible.builtin.systemd_service:
    name: autodeploy.timer
    state: started
    enabled: true
    daemon_reload: true
  tags: autodeploy
