services:
  floci:
    image: floci/floci:latest
    container_name: floci
    networks:
      - dev
    ports:
      - "4566:4566"
    environment:
      - DEBUG=1
    volumes:
      - floci-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql:
    image: mysql:8.0
    container_name: mysql-dev
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: stockflow
      MYSQL_DATABASE: stockflow
      MYSQL_USER: stockflow
      MYSQL_PASSWORD: stockflow
    volumes:
      - mysql-data:/var/lib/mysql
      - ../prod/ansible/roles/db/files/bd.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - dev
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  init-s3:
    image: amazon/aws-cli:latest
    container_name: init-s3
    depends_on:
      floci:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ../s3-dump:/backup
    networks:
      - dev
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "=== Aguardando Floci ==="
        until aws --endpoint-url http://floci:4566 s3 ls > /dev/null 2>&1; do
          echo "Floci não disponível"
          sleep 2
        done

        echo "=== Criando bucket (se não existir) ==="
        aws --endpoint-url http://floci:4566 s3 mb s3://stockflow-dev || true
        echo "=== Bucket pronto ==="

        echo "=== Verificando backup para restore ==="
        if [ ! -d /backup ] || [ -z "$(ls -A /backup 2>/dev/null)" ]; then
          echo "Nenhum backup encontrado em /backup, pulando restore."
        else
          echo "Diretório de backup encontrado, restaurando..."
          aws --endpoint-url http://floci:4566 \
            s3 cp /backup s3://stockflow-dev \
            --recursive
          echo "=== Restore concluído ==="
        fi

  app:
    build:
      context: ../../Back-end
      dockerfile: Dockerfile
    container_name: app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://mysql:3306/stockflow?serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8

      CORS: "http://localhost:8080"
      AWS_S3_ENDPOINT: http://floci:4566
      AWS_S3_BUCKET: stockflow-dev
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_S3_PATH_STYLE_ACCESS: "true"
    networks:
      - dev
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/api/health > /dev/null || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s

  web:
    build:
      context: ../../Front-end
      dockerfile: Dockerfile
    container_name: web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: "http://localhost:8080/api"
    networks:
      - dev
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - web
      - app
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - dev

networks:
  dev:
    name: dev

volumes:
  floci-data:
  mysql-data: