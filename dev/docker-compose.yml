services:
  floci:
    image: floci/floci:latest
    container_name: floci
    ports:
      - "4566:4566"
    environment:
      - DEBUG=1
    volumes:
      - floci-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql:
    image: mysql:8.0
    container_name: mysql-dev
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: stockflow
      MYSQL_DATABASE: stockflow
      MYSQL_USER: stockflow
      MYSQL_PASSWORD: stockflow
    volumes:
      - mysql-data:/var/lib/mysql
      - ../prod/ansible/roles/db/files/bd.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - dev
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  init-s3:
    image: amazon/aws-cli:latest
    container_name: init-s3
    depends_on:
      floci:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: ["sh", "-c"]
    command:
      - |
        until aws --endpoint-url http://floci:4566 s3 ls > /dev/null 2>&1; do
          echo "Floci não disponível"
          sleep 2
        done
        echo "Criando bucket Blobs..."
        aws --endpoint-url http://floci:4566 s3 mb s3://stockflow-dev || true
        echo "Bucket Blobs pronto"

  app:
    build:
      context: ../../Back-end
      dockerfile: Dockerfile
    container_name: app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:mysql://mysql:3306/stockflow?useTimezone=true&serverTimezone=UTC&characterEncoding=UTF-8
      - CORS=http://nginx:80
    networks:
      - dev
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/api/health > /dev/null || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s

  web:
    build:
      context: ../../Front-end
      dockerfile: Dockerfile
    container_name: web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: "http://localhost:8080/api"
    networks:
      - dev
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - web
      - app
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - dev

networks:
  dev:
    name: dev

volumes:
  floci-data:
  mysql-data: